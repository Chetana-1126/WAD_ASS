
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Manage Employees, Shifts and Timings</p>
    </header>

    <!-- Add Employee -->
    <section>
        <h2>Add Employee</h2>

        <form id="employeeForm">
            <label for="employeeId">Employee ID</label>
            <input type="text" id="employeeId" required>

            <label for="employeeName">Employee Name</label>
            <input type="text" id="employeeName" required>

            <button type="submit">Add Employee</button>
        </form>

        <h3>Employee List</h3>
        <ul id="employeeList"></ul>
    </section>

    <!-- Create Shift -->
    <section>
        <h2>Create Shift</h2>

        <label for="shiftDate">Shift Date</label>
        <input type="date" id="shiftDate" required>

        <label for="startTime">Start Time</label>
        <input type="time" id="startTime" required>

        <label for="endTime">End Time</label>
        <input type="time" id="endTime" required>

        <button type="button" id="addShift">Create Shift</button>

        <h3>Employee Shifts</h3>
        <div id="shiftList"></div>
    </section>

    <!-- Assign Shift -->
    <section>
        <h2>Assign Shift to Employee</h2>

        <label for="employeeSelect">Select Employee</label>
        <select id="employeeSelect">
            <option value="">Select Employee</option>
        </select>

        <label for="selectShift">Select Shift</label>
        <select id="selectShift">
            <option value="">Select Shift</option>
        </select>

        <button type="button" id="assignShift">
            Assign Employee
        </button>

        <p id="message"></p>

        <h3>Shift Assignments</h3>
        <div id="assignmentList"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
