<!DOCTYPE html>
<html>
<head>

    <title>User Data</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .table-box{
            width:60%;
            background:white;
            margin:50px auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:blue;
            color:white;
            padding:10px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid gray;
        }

        tr:hover{
            background:#f1f1f1;
        }

    </style>

</head>

<body>

    <div class="table-box">

        <h2>Registered Users</h2>

        <table>

            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>

            <tbody id="data">

            </tbody>

        </table>

    </div>

    <script>

        let users = JSON.parse(localStorage.getItem("users")) || [];

        let output = "";

        users.forEach(function(user){

            output += `
            
            <tr>
                <td>${user.name}</td>
                <td>${user.email}</td>
            </tr>

            `;
        });

        document.getElementById("data").innerHTML = output;

    </script>

</body>
</html>
